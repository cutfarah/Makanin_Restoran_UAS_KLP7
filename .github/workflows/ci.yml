name: Makanin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/makanin_ci?schema=public"
      AUTH_SECRET: "ci-only-secret-for-build-not-production"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build